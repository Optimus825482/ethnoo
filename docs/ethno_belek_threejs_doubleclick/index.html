<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ethno Belek — Çift Tık Uyumlu Three.js 3D Simülasyon</title>
<style>
  :root{--bg:#05100b;--panel:rgba(5,18,12,.80);--line:#34ff82;--text:#eefcf4;--muted:#b8d8c7;--accent:#3cff8b;--red:#e8412f}
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% -20%,#226d45,#07160f 48%,#020604);color:var(--text)}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .ui{position:fixed;left:16px;right:16px;top:14px;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;pointer-events:none}
  .title,.controls,.help{pointer-events:auto;background:var(--panel);border:1px solid rgba(189,255,220,.18);box-shadow:0 18px 55px rgba(0,0,0,.36);backdrop-filter:blur(12px);border-radius:18px}
  .title{padding:14px 16px;max-width:min(560px,calc(100vw - 32px))}
  .badge{display:inline-flex;align-items:center;gap:8px;margin:0 0 7px;padding:5px 9px;border-radius:999px;background:#103420;color:#caffdf;border:1px solid rgba(52,255,130,.22);font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(232,65,47,.18)}
  h1{margin:0;font-size:clamp(19px,2.5vw,34px);letter-spacing:-.035em;line-height:1.03} p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;padding:10px;max-width:620px}.btn,label{border-radius:999px;background:#102e1e;border:1px solid rgba(189,255,220,.18);color:#eafff3;font-size:12px;font-weight:850}.btn{padding:10px 13px;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#baffd6,#39ed85);color:#052014;border:0}.btn:hover{transform:translateY(-1px)}label{display:flex;gap:8px;align-items:center;padding:8px 10px}input[type=range]{width:92px;accent-color:var(--accent)}b{font-variant-numeric:tabular-nums}.help{position:fixed;left:16px;bottom:14px;z-index:10;padding:9px 12px;color:#cfe9da;font-size:12px;line-height:1.45;pointer-events:none}.legend{position:fixed;right:16px;bottom:14px;z-index:10;display:grid;gap:7px;pointer-events:none}.legend span{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid rgba(189,255,220,.18);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;color:#eafff3}.dot{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:#04100a;z-index:50}.loading div{padding:16px 20px;border-radius:18px;background:#0c2619;border:1px solid rgba(52,255,130,.22);color:#dffff0;font-weight:850;box-shadow:0 20px 80px rgba(0,0,0,.45)}
  @media(max-width:860px){.ui{position:fixed;display:grid}.controls{justify-content:flex-start}.title p{display:none}.help{display:none}.legend{left:16px;right:auto;bottom:10px}.btn,label{font-size:11px;padding:8px 10px}input[type=range]{width:75px}}

  /* Güncelleme: başlık kaldırıldı; kontrol paneli haritanın alt kısmına taşındı. */
  .ui{top:auto!important;bottom:14px!important;left:14px!important;right:14px!important;justify-content:center!important;align-items:flex-end!important}
  .title{display:none!important}
  .controls{max-width:min(960px,calc(100vw - 28px))!important;justify-content:center!important;padding:11px 12px!important;border-radius:22px!important}
  .help{top:14px!important;bottom:auto!important;left:14px!important;max-width:420px;background:rgba(5,18,12,.62)!important}
  .legend{top:14px!important;bottom:auto!important;right:14px!important}
  @media(max-width:860px){.ui{bottom:8px!important}.controls{max-height:42vh;overflow:auto;justify-content:center!important}.legend{display:none}.help{display:none}}


  .ui{transition:transform .28s ease,opacity .22s ease}
  .ui.panel-hidden{transform:translateY(calc(100% + 34px));opacity:0;pointer-events:none}
  #showPanelBtn{position:fixed;left:50%;bottom:14px;z-index:30;transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;background:linear-gradient(180deg,#baffd6,#39ed85);color:#052014;border:0;border-radius:999px;padding:11px 16px;font-weight:900;box-shadow:0 12px 35px rgba(0,0,0,.38);cursor:pointer;transition:opacity .22s ease,transform .28s ease}
  #showPanelBtn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  body.view-locked canvas{cursor:not-allowed!important}
  .btn.locked{background:#ffcf4d!important;color:#241900!important;border-color:rgba(255,255,255,.3)!important}

</style>
</head>
<body>
<div id="app"></div>
<div id="loading" class="loading"><div>Çift tık uyumlu Three.js sürümü yükleniyor…</div></div>
<div class="ui">
  <section class="controls" aria-label="3D simülasyon kontrolleri">
    <button id="playBtn" class="btn primary">⏸ Durdur</button>
    <button id="cam3dBtn" class="btn">3D Kamera</button>
    <button id="topBtn" class="btn">Üstten 2D</button>
    <button id="autoCamBtn" class="btn">Kamera Turu</button>
    <button id="viewLockBtn" class="btn">Görünümü Kilitle</button>
    <button id="locBtn" class="btn">3D Pinleri Gizle</button>
    <label>Hız <input id="speedRange" type="range" min="0.25" max="2.5" step="0.05" value="0.50"><b id="speedText">0.50×</b></label>
    <label>Boyut <input id="vehicleSizeRange" type="range" min="0.45" max="3" step="0.05" value="1.75"><b id="vehicleSizeText">1.75×</b></label>
    <label>Araç <input id="countRange" type="range" min="3" max="18" step="1" value="10"><b id="countText">10</b></label>
    <button id="panelHideBtn" class="btn">Paneli Gizle</button>
  </section>
</div>
<button id="showPanelBtn" type="button">Paneli Göster</button>
<div class="help">Mouse: döndür · tekerlek: zoom · sağ/orta sürükle: pan · Görünümü Kilitle ile kamera sabitlenir, Paneli Gizle ile alt kontrol paneli kapanır.</div>
<div class="legend"><span><i class="dot" style="--c:#28ff72"></i>Temiz yeşil rota</span></div>

<script src="./three.min.js"></script>

const volumeGroup = new THREE.Group(); scene.add(volumeGroup);
function makeCropTexture(x1,y1,x2,y2){
  const t = tex.clone();
  t.needsUpdate = true;
  t.wrapS = THREE.ClampToEdgeWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.repeat.set(Math.abs(x2-x1)/IMG_W, Math.abs(y2-y1)/IMG_H);
  t.offset.set(Math.min(x1,x2)/IMG_W, 1 - Math.max(y1,y2)/IMG_H);
  return t;
}
function addTexturedBlock(x1,y1,x2,y2,h,sideColor=0x40584b,sideOpacity=.40,name=''){
  const c = rectCenter(x1,y1,x2,y2);
  const w = Math.abs(x2-x1)/IMG_W*MAP_W, d = Math.abs(y2-y1)/IMG_H*MAP_H;
  const sideMat = new THREE.MeshStandardMaterial({color:sideColor, transparent:true, opacity:sideOpacity, roughness:.68, metalness:.02});
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), sideMat);
  mesh.position.set(c.x, h/2+.055, c.z);
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.name = name; volumeGroup.add(mesh);

  const roofTex = makeCropTexture(x1,y1,x2,y2);
  const roofMat = new THREE.MeshStandardMaterial({map:roofTex, color:0xffffff, roughness:.50, metalness:.01});
  const roof = new THREE.Mesh(new THREE.PlaneGeometry(w*1.012,d*1.012), roofMat);
  roof.rotation.x = -Math.PI/2;
  roof.position.set(c.x, h+.07, c.z);
  roof.castShadow = true; roof.receiveShadow = false; roof.name = name + ' texture roof'; volumeGroup.add(roof);

  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry), new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.30}));
  edge.position.copy(mesh.position); volumeGroup.add(edge);
  return mesh;
}
function addLowArea(x1,y1,x2,y2,h,color=0x54c86d,opacity=.22,name=''){
  const c = rectCenter(x1,y1,x2,y2);
  const w = Math.abs(x2-x1)/IMG_W*MAP_W, d = Math.abs(y2-y1)/IMG_H*MAP_H;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color, transparent:true, opacity, roughness:.74, metalness:.01}));
  m.position.set(c.x,h/2+.04,c.z); m.castShadow=true; m.receiveShadow=true; m.name=name; volumeGroup.add(m);
  return m;
}
function addCylinderArea(px,py,rx,ry,h,color=0xf6f0df,opacity=.34,name=''){
  const p = pxToWorld(px,py,0);
  const geo = new THREE.CylinderGeometry(1,1,h,48);
  const mat = new THREE.MeshStandardMaterial({color, transparent:true, opacity, roughness:.62, metalness:.02});

  m.scale.set(rx/IMG_W*MAP_W,1,ry/IMG_H*MAP_H);
  m.position.set(p.x,h/2+.06,p.z); m.castShadow=true; m.receiveShadow=true; m.name=name; volumeGroup.add(m);
  return m;
}

function makePinTexture(num){
  const c = document.createElement('canvas');
  c.width = 192; c.height = 248;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8;
  const cx = 96, cy = 70, r = 48;
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI*0.82, Math.PI*2.18, false);
  ctx.quadraticCurveTo(136, 128, cx, 206);
  ctx.quadraticCurveTo(56, 128, 50, 70);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0,18,0,176);
  grad.addColorStop(0,'#ff7966'); grad.addColorStop(1,'#d71918');
  ctx.fillStyle = grad; ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = 'white'; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, 31, 0, Math.PI*2); ctx.fillStyle='white'; ctx.fill();
  ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.13)'; ctx.stroke();
  ctx.fillStyle='#1b1b1b'; ctx.font='900 38px Inter, Arial, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(num), cx, cy+1);
  const tex = new THREE.CanvasTexture(c);
  if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace; else tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function addLocationPins(){

    spr.position.set(p.x, p.y, p.z);
    spr.scale.set(5.2, 6.7, 1);
    spr.renderOrder = 200;
    spr.userData = s;
    locationGroup.add(spr);
  });
}

// Routes
function parsePathD(d){
  const nums = d.match(/-?\d+(?:\.\d+)?/g).map(Number);
  const pts=[];
  for(let i=0;i<nums.length;i+=2) pts.push(pxToWorld(nums[i], nums[i+1], .38));
  return pts;
}
function pointSegDistance2D(p,a,b){
  const vx=b.x-a.x, vz=b.z-a.z, wx=p.x-a.x, wz=p.z-a.z;
  const c1 = vx*wx + vz*wz;
  if(c1 <= 0) return Math.hypot(p.x-a.x, p.z-a.z);
  const c2 = vx*vx + vz*vz;
  if(c2 <= c1) return Math.hypot(p.x-b.x, p.z-b.z);
  const t = c1 / c2;
  return Math.hypot(p.x-(a.x+t*vx), p.z-(a.z+t*vz));
}
function simplifyRDP(points, eps=.55){
  if(points.length < 3) return points;
  const keep = new Uint8Array(points.length);
  keep[0]=1; keep[points.length-1]=1;
  const stack=[[0,points.length-1]];
  while(stack.length){
    const [s,e] = stack.pop();
    let maxD=0, idx=-1;
    for(let i=s+1;i<e;i++){
      const d = pointSegDistance2D(points[i], points[s], points[e]);
      if(d>maxD){ maxD=d; idx=i; }
    }
    if(maxD > eps && idx > -1){ keep[idx]=1; stack.push([s,idx],[idx,e]); }
  }
  return points.filter((_,i)=>keep[i]);
}
function removeTinySteps(points, minStep=.16){
  if(points.length < 2) return points;
  const out=[points[0]];
  for(let i=1;i<points.length-1;i++){
    if(out[out.length-1].distanceTo(points[i]) >= minStep) out.push(points[i]);
  }
  out.push(points[points.length-1]);
  return out;
}
function prepareRoute(route){
  // Yol maskesinden gelen skeleton çizgisi piksel piksel zikzaklıydı.
  // Araçların sağ-sol titrememesi için rota önce seyreltilip RDP ile yumuşatılıyor.
  const raw = parsePathD(route.d);
  route.points = simplifyRDP(removeTinySteps(raw), .55);
  route.cum = [0];
  let total = 0;
  for(let i=1;i<route.points.length;i++){ total += route.points[i-1].distanceTo(route.points[i]); route.cum.push(total); }
  route.total = total;
  const lineGeo = new THREE.BufferGeometry().setFromPoints(route.points);
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color:route.color, transparent:true, opacity:.55}));
  scene.add(line);
  const glow = new THREE.Line(lineGeo.clone(), new THREE.LineBasicMaterial({color:route.color, transparent:true, opacity:.18}));
  glow.position.y += .045; glow.scale.set(1.002,1,1.002); scene.add(glow);
}
function sampleRoute(route, distance){
  let d = ((distance % route.total) + route.total) % route.total;
  let lo=0, hi=route.cum.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; if(route.cum[mid] < d) lo=mid+1; else hi=mid; }
  const i = Math.max(1, lo);
  const d0 = route.cum[i-1], d1 = route.cum[i];
  const t = d1===d0 ? 0 : (d-d0)/(d1-d0);
  const a = route.points[i-1], b = route.points[i];
  const pos = a.clone().lerp(b,t);
  const dir = b.clone().sub(a).normalize();
  return {pos, dir};
}
ROUTES.forEach(prepareRoute);

// 3D shuttle/golf cart model
const cartColors = [0x111111,0x0b3d91,0xe8412f,0xffd84d,0x00b36b,0xf97316,0x8e44ad,0xf7f7f2,0x20c7d9,0xff4fa3,0x30343b,0x2563eb];
function mat(color, opts={}){ return new THREE.MeshStandardMaterial({color, roughness:.55, metalness:.08, ...opts}); }
function createCart(color){
  const g = new THREE.Group();
  const bodyMat = mat(color); const dark = mat(0x111812); const roof = mat(0xf8fff9); const glass = mat(0x9be9ff,{transparent:true,opacity:.55,roughness:.15});
  const base = new THREE.Mesh(new THREE.BoxGeometry(2.25,.42,1.12), bodyMat); base.position.y=.45; base.castShadow=true; g.add(base);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(.65,.30,1.02), bodyMat); hood.position.set(.98,.68,0); hood.castShadow=true; g.add(hood);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(.72,.55,.88), dark); seat.position.set(-.25,.86,0); seat.castShadow=true; g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(.16,.72,.88), dark); back.position.set(-.62,1.12,0); back.castShadow=true; g.add(back);
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(1.95,.13,1.28), roof); canopy.position.set(-.18,1.72,0); canopy.castShadow=true; g.add(canopy);
  [[-.98,-.55],[-.98,.55],[.58,-.55],[.58,.55]].forEach(([x,z])=>{ const pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.9,8), roof); pole.position.set(x,1.24,z); pole.castShadow=true; g.add(pole); });
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(.08,.65,.92), glass); windshield.position.set(.48,1.17,0); windshield.rotation.z=-0.18; g.add(windshield);
  const wheelGeo = new THREE.CylinderGeometry(.27,.27,.18,18);
  const wheels=[];
  [[-.72,-.65],[-.72,.65],[.78,-.65],[.78,.65]].forEach(([x,z])=>{ const w=new THREE.Mesh(wheelGeo,dark); w.rotation.x=Math.PI/2; w.position.set(x,.25,z); w.castShadow=true; wheels.push(w); g.add(w); });
  const light1 = new THREE.Mesh(new THREE.SphereGeometry(.07,10,8), mat(0xfff3a3,{emissive:0xffe88a, emissiveIntensity:1.6})); light1.position.set(1.33,.72,-.28); g.add(light1);
  const light2 = light1.clone(); light2.position.z=.28; g.add(light2);
  g.userData.wheels = wheels;
  return g;
}

let vehicles=[]; let running=true; let speedFactor=.50; let vehicleSizeFactor=1.75;
function routeForIndex(i){ return (ROUTES.length>1 && i%5===2) ? ROUTES[1] : ROUTES[0]; }
function applyVehicleSize(){
  vehicles.forEach(v => v.group.scale.setScalar(v.baseScale * vehicleSizeFactor));
}
function rebuildVehicles(count){
  vehicles.forEach(v=>scene.remove(v.group)); vehicles=[];
  for(let i=0;i<count;i++){
    const route = routeForIndex(i);
    const group = createCart(cartColors[i%cartColors.length]);
    const baseScale = .86 + (i%3)*.05;
    group.scale.setScalar(baseScale * vehicleSizeFactor);
    scene.add(group);
    vehicles.push({group, route, baseScale, dist:(route.total*((i+.35)/count)+(i%4)*8)%route.total, speed:route.speed*(.88+(i%5)*.06)});
    updateVehicle(vehicles[vehicles.length-1],0);
  }
  document.getElementById('countText').textContent = String(count);
}
function updateVehicle(v, deltaDist){
  v.dist = (v.dist + deltaDist) % v.route.total;
  const {pos} = sampleRoute(v.route, v.dist);
  // Anlık segment yönü yerine birkaç metre ileriye bakıyoruz; böylece zikzaklı çizgide sağ-sol titreme olmaz.
  const ahead = sampleRoute(v.route, v.dist + 3.2).pos;
  const dir = ahead.clone().sub(pos).normalize();
  const targetYaw = Math.atan2(-dir.z, dir.x);
  if(v.yaw === undefined) v.yaw = targetYaw;
  const diff = Math.atan2(Math.sin(targetYaw - v.yaw), Math.cos(targetYaw - v.yaw));
  v.yaw += diff * Math.min(1, 0.16 + Math.abs(deltaDist) * 0.045);
  v.group.position.set(pos.x, .62, pos.z);
  v.group.rotation.y = v.yaw;
  v.group.userData.wheels?.forEach(w => { w.rotation.z -= deltaDist * 1.8; });
}

// Simple custom orbit controls
let dragging=false, panMode=false, lastX=0, lastY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ if(viewLocked) return; dragging=true; panMode=e.button===1||e.button===2||e.shiftKey; lastX=e.clientX; lastY=e.clientY; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());
renderer.domElement.addEventListener('pointerup', ()=>dragging=false);
renderer.domElement.addEventListener('pointermove', e=>{
  if(!dragging) return; const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  if(panMode){
    const panSpeed = spherical.radius * .00075;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix,0).multiplyScalar(-dx*panSpeed);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix,1).multiplyScalar(dy*panSpeed);
    target.add(right).add(up);
  }else{
    spherical.theta -= dx*.006; spherical.phi = THREE.MathUtils.clamp(spherical.phi + dy*.0045, THREE.MathUtils.degToRad(14), THREE.MathUtils.degToRad(88));
  }
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e=>{ e.preventDefault(); if(viewLocked) return; spherical.radius = THREE.MathUtils.clamp(spherical.radius * (1 + e.deltaY*.001), 65, 260); updateCamera(); }, {passive:false});

// UI
const playBtn=document.getElementById('playBtn'), locBtn=document.getElementById('locBtn'), viewLockBtn=document.getElementById('viewLockBtn'), panelHideBtn=document.getElementById('panelHideBtn'), showPanelBtn=document.getElementById('showPanelBtn'), speedRange=document.getElementById('speedRange'), speedText=document.getElementById('speedText'), vehicleSizeRange=document.getElementById('vehicleSizeRange'), vehicleSizeText=document.getElementById('vehicleSizeText'), countRange=document.getElementById('countRange');
let autoCam=false; let viewLocked=false;
playBtn.onclick=()=>{ running=!running; playBtn.textContent=running?'⏸ Durdur':'▶ Başlat'; };
speedRange.oninput=()=>{ speedFactor=Number(speedRange.value); speedText.textContent=speedFactor.toFixed(2)+'×'; };
vehicleSizeRange.oninput=()=>{ vehicleSizeFactor=Number(vehicleSizeRange.value); vehicleSizeText.textContent=vehicleSizeFactor.toFixed(2)+'×'; applyVehicleSize(); };
countRange.oninput=()=>rebuildVehicles(Number(countRange.value));
document.getElementById('cam3dBtn').onclick=()=>{ if(viewLocked) return; spherical={radius:150, theta:.35, phi:THREE.MathUtils.degToRad(52)}; target.set(0,0,0); updateCamera(); };
document.getElementById('topBtn').onclick=()=>{ if(viewLocked) return; spherical={radius:155, theta:0, phi:THREE.MathUtils.degToRad(1)}; target.set(0,0,0); updateCamera(); };
document.getElementById('autoCamBtn').onclick=()=>{ if(viewLocked) return; autoCam=!autoCam; document.getElementById('autoCamBtn').textContent=autoCam?'Kamera Dursun':'Kamera Turu'; };
locBtn.onclick=()=>{ locationGroup.visible = !locationGroup.visible; locBtn.textContent = locationGroup.visible ? '3D Pinleri Gizle' : '3D Pinleri Göster'; };
viewLockBtn.onclick=()=>{
  viewLocked = !viewLocked;
  dragging = false;
  if(viewLocked){ autoCam=false; document.getElementById('autoCamBtn').textContent='Kamera Turu'; }
  document.body.classList.toggle('view-locked', viewLocked);
  viewLockBtn.classList.toggle('locked', viewLocked);
  viewLockBtn.textContent = viewLocked ? 'Görünüm Kilitli' : 'Görünümü Kilitle';
};
panelHideBtn.onclick=()=>{ document.querySelector('.ui').classList.add('panel-hidden'); showPanelBtn.classList.add('show'); };
showPanelBtn.onclick=()=>{ document.querySelector('.ui').classList.remove('panel-hidden'); showPanelBtn.classList.remove('show'); };

rebuildVehicles(Number(countRange.value));
loading.style.display='none';

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  if(running) vehicles.forEach(v=>updateVehicle(v, v.speed*speedFactor*dt));
  if(autoCam && !viewLocked){ spherical.theta += dt*.12; spherical.phi = THREE.MathUtils.degToRad(52 + Math.sin(performance.now()/1800)*4); updateCamera(); }
  renderer.render(scene,camera);
}
animate();

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

})();
</script>
