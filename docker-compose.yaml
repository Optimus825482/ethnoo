services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shuttlecall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-518518Erkan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-518518Erkan}@db:5432/shuttlecall?schema=public"
    volumes:
      - uploads:/app/public/images/locations
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3016/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.ethno.rule=Host(`ethno.erkanerdem.online`)"
      - "traefik.http.routers.ethno.entrypoints=https"
      - "traefik.http.routers.ethno.tls=true"
      - "traefik.http.routers.ethno.tls.certresolver=letsencrypt"
      - "traefik.http.services.ethno.loadbalancer.server.port=3016"
      - "traefik.http.routers.ethno-http.rule=Host(`ethno.erkanerdem.online`)"
      - "traefik.http.routers.ethno-http.entrypoints=http"
      - "traefik.http.routers.ethno-http.middlewares=ethno-redirect"
      - "traefik.http.middlewares.ethno-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ethno-redirect.redirectscheme.permanent=true"

  worker:
    build: .
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "src/workers/index.ts"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-518518Erkan}@db:5432/shuttlecall?schema=public"
    volumes:
      - uploads:/app/public/images/locations
    networks:
      - default

networks:
  coolify:
    external: true
  default:

volumes:
  pgdata:
  uploads:
