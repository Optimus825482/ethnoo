services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shuttlecall
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@db:5432/shuttlecall?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: "https://shuttlecall.com"
      NEXT_PUBLIC_APP_NAME: "ShuttleCall"
      NEXT_PUBLIC_APP_URL: "https://shuttlecall.com"
      NODE_ENV: "production"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL}
    volumes:
      - uploads:/app/public/images/locations
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTPS router
      - "traefik.http.routers.shuttlecall.rule=Host(`shuttlecall.com`)"
      - "traefik.http.routers.shuttlecall.entrypoints=https"
      - "traefik.http.routers.shuttlecall.tls=true"
      - "traefik.http.routers.shuttlecall.tls.certresolver=letsencrypt"
      - "traefik.http.services.shuttlecall.loadbalancer.server.port=3016"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.shuttlecall-http.rule=Host(`shuttlecall.com`)"
      - "traefik.http.routers.shuttlecall-http.entrypoints=http"
      - "traefik.http.routers.shuttlecall-http.middlewares=shuttlecall-redirect"
      - "traefik.http.middlewares.shuttlecall-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.shuttlecall-redirect.redirectscheme.permanent=true"

networks:
  coolify:
    external: true
  default:

volumes:
  pgdata:
  uploads:
